name: Update Pulse Trends

on:
  schedule:
    - cron: "0 */3 * * *"   # 3時間おき(UTC基準)
  workflow_dispatch: {}       # 手動実行ボタンも欲しいので追加

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_trends.py
      - name: Commit updated data
        run: |
          git config user.name "pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/articles.json
          git diff --staged --quiet || git commit -m "chore: update trends"
          git push
